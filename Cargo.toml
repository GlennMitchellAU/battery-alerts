[package]
name = "battery-alerts"
version = "0.1.0"
edition = "2021"
description = "A small Windows wireless-device battery monitor with a pop-down island"
license = "MIT"
repository = "https://github.com/GlennMitchellAU/battery-alerts"
readme = "README.md"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61.2", features = [
    "Win32_Devices_Bluetooth", "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties", "Win32_Devices_HumanInterfaceDevice", "Win32_Foundation", "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem", "Win32_System_LibraryLoader",
    "Win32_System_Console", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Diagnostics_ToolHelp", "Win32_Security",
    "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
debug = 0
panic = "abort"
