<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="title desc">
  <title id="title">Battery Alerts island preview</title>
  <desc id="desc">Illustration of a black notification attached to the top of a display. A Corsair wireless mouse has a simulated 15 percent battery reading, with snooze and dismiss controls.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172d43"/><stop offset="1" stop-color="#090f19"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="170%"><feDropShadow dy="12" stdDeviation="12" flood-opacity=".4"/></filter>
  </defs>
  <rect width="1000" height="350" fill="url(#backdrop)"/>
  <path d="M175 0H825V185Q825 216 794 216H206Q175 216 175 185Z" fill="#090a0c" filter="url(#shadow)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <circle cx="216" cy="34" r="3.5" fill="#ffb84d"/>
    <text x="233" y="39" fill="#96979e" font-size="13" font-weight="600">LOW BATTERY · PREVIEW</text>
    <rect x="212" y="70" width="52" height="75" rx="25" fill="#2d2e34"/>
    <rect x="234" y="80" width="8" height="17" rx="4" fill="#ffb84d"/>
    <text x="289" y="100" fill="#f6f6f9" font-size="25" font-weight="600">CORSAIR wireless mouse</text>
    <text x="289" y="132" fill="#96979e" font-size="15">Plug in your mouse before it switches off</text>
    <text x="790" y="110" text-anchor="end" fill="#ffb84d" font-size="40" font-weight="600">15%</text>
    <text x="789" y="136" text-anchor="end" fill="#96979e" font-size="12">remaining</text>
    <rect x="526" y="163" width="147" height="35" rx="17" fill="#1f2025"/>
    <text x="599" y="185" text-anchor="middle" fill="#f6f6f9" font-size="14">Snooze 1 hour</text>
    <text x="738" y="185" text-anchor="middle" fill="#96979e" font-size="14">Dismiss</text>
    <text x="500" y="291" text-anchor="middle" fill="#bdcbd8" font-size="17">A little warning. Before a lost connection.</text>
  </g>
</svg>
